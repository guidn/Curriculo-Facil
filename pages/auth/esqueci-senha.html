<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — Currículo Fácil</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components/button.css"><link rel="stylesheet" href="../../css/components/form.css"><link rel="stylesheet" href="../../css/pages/auth.css"></head>
<body class="auth-page"><header class="auth-header"><a class="brand" href="../../index.html"><span class="brand-mark">CF</span><span>Currículo<span class="brand-accent">Fácil</span></span></a><a class="back-link" href="login.html">← Voltar ao login</a></header>
<main class="auth-main"><section class="auth-card"><div class="auth-heading"><span class="eyebrow">Recuperação de acesso</span><h1>Vamos recuperar sua senha.</h1><p>Informe o e-mail da sua conta. Enviaremos um código de confirmação.</p></div><form class="auth-form" data-forgot-form><label class="form-field"><span>E-mail</span><input name="email" type="email" autocomplete="email" required></label><button class="button button-primary button-full" type="submit">Enviar código</button><p class="auth-message" data-message role="status" aria-live="polite"></p><p class="auth-message auth-dev-code" data-dev-code hidden></p></form><p class="auth-switch"><a href="login.html">Voltar para o login</a></p></section></main>
<script>
document.querySelector('[data-forgot-form]').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),message=form.querySelector('[data-message]'),dev=form.querySelector('[data-dev-code]');button.disabled=true;message.textContent='Solicitando código…';dev.hidden=true;try{const response=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.elements.email.value})}),result=await response.json();if(!response.ok)throw new Error(result.error||'Não foi possível solicitar o código.');sessionStorage.setItem('passwordResetEmail',form.elements.email.value.trim());message.textContent=result.message||'Se o e-mail estiver cadastrado, enviaremos um código.';if(result.developmentCode){dev.hidden=false;dev.textContent=`Código de desenvolvimento: ${result.developmentCode}`;}setTimeout(()=>location.href='reset-senha.html',1200)}catch(error){message.textContent=error.message}finally{button.disabled=false}});
</script></body></html>

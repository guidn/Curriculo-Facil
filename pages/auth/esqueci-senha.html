<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — Currículo Fácil</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components/button.css"><link rel="stylesheet" href="../../css/components/form.css"><link rel="stylesheet" href="../../css/pages/auth.css"></head><body class="auth-page"><header class="auth-header"><a class="brand" href="../../index.html"><span class="brand-mark">CF</span><span>Currículo<span class="brand-accent">Fácil</span></span></a><a class="back-link" href="login.html">← Voltar</a></header><main class="auth-main"><section class="auth-card"><div class="auth-heading"><span class="eyebrow">Recuperação</span><h1>Esqueceu a senha?</h1><p>Informe seu e-mail para gerar um link de recuperação.</p></div><form class="auth-form" data-forgot-form><label class="form-field"><span>E-mail</span><input name="email" type="email" required></label><button class="button button-primary button-full">Enviar recuperação</button></form><p class="auth-switch"><a href="login.html">Voltar para o login</a></p></section></main><script>document.querySelector('[data-forgot-form]').addEventListener('submit',async e=>{e.preventDefault();const email=e.currentTarget.email.value;try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}).then(x=>x.json());alert(r.developmentToken?`Token de desenvolvimento: ${r.developmentToken}`:r.message)}catch{alert('Não foi possível solicitar a recuperação.')}}</script></body></html>

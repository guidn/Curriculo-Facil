<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar código — Currículo Fácil</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components/button.css"><link rel="stylesheet" href="../../css/components/form.css"><link rel="stylesheet" href="../../css/pages/auth.css"></head>
<body class="auth-page"><header class="auth-header"><a class="brand" href="../../index.html"><span class="brand-mark">CF</span><span>Currículo<span class="brand-accent">Fácil</span></span></a><a class="back-link" href="esqueci-senha.html">← Solicitar outro código</a></header>
<main class="auth-main"><section class="auth-card"><div class="auth-heading"><span class="eyebrow">Confirmação por e-mail</span><h1>Confirme seu código.</h1><p>Digite o código de 6 dígitos recebido e escolha uma nova senha. O código pode ser usado uma única vez.</p></div><form class="auth-form" id="resetForm"><label class="form-field"><span>Código de confirmação</span><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="000000" required></label><label class="form-field"><span>Nova senha</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label class="form-field"><span>Confirmar nova senha</span><input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-primary button-full" type="submit">Confirmar e alterar senha</button><p class="auth-message" data-message role="status" aria-live="polite"></p></form></section></main>
<script>
document.querySelector('#resetForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),message=form.querySelector('[data-message]'),password=form.elements.password.value;if(password!==form.elements.confirm.value){message.textContent='As senhas não coincidem.';return}button.disabled=true;message.textContent='Confirmando código…';try{const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:form.elements.code.value.trim(),password})}),result=await response.json();if(!response.ok)throw new Error(result.error||'Não foi possível alterar a senha.');sessionStorage.removeItem('passwordResetEmail');message.textContent='Senha alterada. Redirecionando para o login…';setTimeout(()=>location.href='login.html',1200)}catch(error){message.textContent=error.message}finally{button.disabled=false}});
</script></body></html>

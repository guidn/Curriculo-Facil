<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — Currículo Fácil</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components/button.css"><link rel="stylesheet" href="../../css/components/form.css"><link rel="stylesheet" href="../../css/pages/auth.css"></head><body class="auth-page"><header class="auth-header"><a class="brand" href="../../index.html"><span class="brand-mark">CF</span><span>Currículo<span class="brand-accent">Fácil</span></span></a></header><main class="auth-main"><section class="auth-card"><div class="auth-heading"><span class="eyebrow">Recuperação</span><h1>Crie uma nova senha.</h1><p>Escolha uma senha com pelo menos 8 caracteres.</p></div><form class="auth-form" id="resetForm"><label class="form-field"><span>Nova senha</span><input id="password" type="password" minlength="8" required></label><label class="form-field"><span>Confirmar senha</span><input id="confirm" type="password" minlength="8" required></label><button class="button button-primary button-full">Alterar senha</button></form></section></main><script>document.querySelector('#resetForm').addEventListener('submit',async e=>{e.preventDefault();const p=document.querySelector('#password').value,c=document.querySelector('#confirm').value;if(p!==c)return alert('As senhas não coincidem.');const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}).then(x=>x.json());if(r.error)return alert(r.error);alert('Senha alterada com sucesso.');location.href='login.html'})</script></body></html>

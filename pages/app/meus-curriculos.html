<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus currículos — Currículo Fácil</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components/button.css"><link rel="stylesheet" href="../../css/components/card.css"><link rel="stylesheet" href="../../css/pages/resumes.css"></head><body><header class="site-header"><a class="brand" href="dashboard.html" data-home-link data-guest-home="../../index.html" data-member-home="dashboard.html"><span class="brand-mark">CF</span><span>Currículo<span class="brand-accent">Fácil</span></span></a><a class="button button-ghost button-small" href="dashboard.html">← Painel</a></header><main class="app-main container"><div class="dashboard-head"><div><span class="eyebrow">Biblioteca</span><h1>Meus currículos</h1><p>Gerencie, edite e compartilhe seus documentos.</p></div><a class="button button-primary" href="../builder/novo-curriculo.html">＋ Novo currículo</a></div><section class="card panel"><div data-resume-library></div></section></main><script src="../../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const r=await CurriculoFacil.api('/resumes');const b=document.querySelector('[data-resume-library]');b.innerHTML=r.resumes.length?r.resumes.map(x=>`<div class="resume-row"><div class="resume-info"><div class="resume-thumb"></div><div><strong>${x.title.replace(/[<>]/g,'')}</strong><span>${new Date(x.updatedAt).toLocaleString('pt-BR')} · ${x.template}</span></div></div><div style="display:flex;gap:8px"><a class="button button-secondary button-small" href="../builder/editor.html?id=${x.id}">Editar</a><button class="button button-ghost button-small" data-delete="${x.id}">Excluir</button></div></div>`).join(''):'<p class="muted">Nenhum currículo ainda.</p>';b.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=async()=>{if(confirm('Excluir este currículo?')){await CurriculoFacil.api('/resumes/'+btn.dataset.delete,{method:'DELETE'});location.reload()}})}catch(e){CurriculoFacil.toast(e.message,'error')}})</script></body></html>
